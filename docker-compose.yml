services:
  db:
    image: postgres:17-alpine
    env_file: .env
    ports:
      - "5433:5432"
    volumes:
      - postgresDB:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    depends_on:
      - db
    volumes:
      - .:/app
    ports:
      - "8000:8000"


volumes:
  postgresDB:
